[package]
name = "app"
version = "0.1.0"
edition = "2024"

[dependencies]
timer-core = { path = "../timer-core" }
leptos = { version = "=0.8.22", features = ["csr"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
js-sys = "=0.3.107"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "=0.4.80"
web-sys = { version = "=0.3.107", features = [
    "AudioContext",
    "AudioContextState",
    "AudioDestinationNode",
    "AudioNode",
    "AudioParam",
    "AudioScheduledSourceNode",
    "BaseAudioContext",
    "CssStyleDeclaration",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "GainNode",
    "HtmlElement",
    "HtmlInputElement",
    "Navigator",
    "OscillatorNode",
    "OscillatorType",
    "Performance",
    "Storage",
    "VisibilityState",
    "Window",
] }
